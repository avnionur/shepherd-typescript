# Release workflow for signed provenance and npm publication.
#
# Status: present but never run. Hosted workflows are disabled: attempts on 2026-09-23 (#191, #199)
# to run CI were blocked by an account billing limit and the workflows were disabled again. The
# package is `"private": true` and no registry credentials or signing identity exist.
# Signing and publication are waived for 1.0 by owner decision (#199, O-2 in
# .plan/production-hardening-contract.md): 1.0 is a private, unpublished source release. The same
# gates run locally with `pnpm verify:release`; if publication happens later, the owner release
# runbook in docs/release-integrity.md is the procedure.
#
# Action references are pinned to commit SHAs resolved read-only from each action's release tag.

name: Release

on:
    workflow_dispatch:
        inputs:
            publish:
                description: Publish the verified tarball to npm after attestation
                required: true
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Verify, build reproducibly, and attest
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            attestations: write
            contents: read
            id-token: write

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

            - name: Install Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install Linux filesystem metadata probes
              run: sudo apt-get update && sudo apt-get install --yes acl attr

            - name: Install dependencies without lifecycle scripts
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Verify, reproduce the build, and write SBOM and provenance
              run: pnpm verify:release
              env:
                  npm_config_cache: ${{ runner.temp }}/npm-cache

            - name: Attest build provenance for the tarball
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: release/*.tgz

            - name: Upload release evidence
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release
                  path: release/
                  if-no-files-found: error

    publish:
        name: Publish to npm
        needs: build
        if: ${{ inputs.publish }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: npm-publish
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Download release evidence
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release
                  path: release

            - name: Install Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org

            - name: Publish the attested tarball with npm provenance
              run: npm publish release/*.tgz --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
