name: CodeQL

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: "23 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze JavaScript and TypeScript
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
              with:
                  languages: javascript-typescript

            - name: Build automatically
              uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

            - name: Analyze
              uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
              with:
                  category: /language:javascript-typescript
